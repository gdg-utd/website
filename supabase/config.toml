project_id = "gdgwebsite"

[functions.send-application-email]
verify_jwt = true
entrypoint = "./functions/send-application-email/index.ts"
import_map = "./functions/send-application-email/deno.json"

[functions.request-password-reset]
verify_jwt = false
entrypoint = "./functions/request-password-reset/index.ts"
import_map = "./functions/request-password-reset/deno.json"

[functions.process-application-emails]
# The function validates its private Vault token before reading any queued mail.
verify_jwt = false
entrypoint = "./functions/process-application-emails/index.ts"
import_map = "./functions/process-application-emails/deno.json"

[functions.email-health]
# Read-only reporting. The handler verifies the user and active administrator role.
verify_jwt = true
entrypoint = "./functions/email-health/index.ts"
import_map = "./functions/email-health/deno.json"

[functions.resume-storage]
# Verifies the member session for uploads and the Vault token for cleanup.
verify_jwt = false
entrypoint = "./functions/resume-storage/index.ts"
import_map = "./functions/resume-storage/deno.json"
