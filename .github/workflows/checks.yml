name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:database
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Check production build
        run: npm run build:check
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Test critical flows on desktop and mobile
        run: npx playwright test
      - name: Save browser reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
